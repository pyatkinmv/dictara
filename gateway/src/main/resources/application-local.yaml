# Local development profile: `./gradlew bootRun --args="--spring.profiles.active=local"`
# (see docs/local-backend-integration.md). Together with the beans marked @Profile("local") and the
# guard in LocalProfileGuard this gives a gateway that needs only Postgres: a stub transcriber, audio
# kept in the database, no scheduled jobs that touch storage, and a stub Telegram bot (LocalTelegramBotSimulator)
# so the real login screen works without running tg-bot or having a Telegram account.

spring:
  datasource:
    # Only localhost and the dictara_dev database are accepted (LocalProfileGuard).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dictara_dev}
  flyway:
    # db/local: the table for LocalDbAudioStorage and the seed data. Never on the production path.
    locations: classpath:db/migration,classpath:db/local

dictara:
  transcriber:
    # The stub answers instantly, so polling every 5 s would only slow the client down.
    poll-interval-ms: 1000
  local:
    stub:
      pending-seconds: 2
      transcribe-seconds: 10
      diarize-seconds: 5
      login-confirm-seconds: 2

# Only for the cosmetic link on the "we couldn't reach you on Telegram" screen when testing it locally
# (username "unknown"); the local stub never actually calls Telegram, so this need not be a real bot.
telegram:
  bot-username: ${TELEGRAM_BOT_USERNAME:dictara_bot}

jwt:
  # The default in application.yaml is too short for JJWT. Tokens signed with this key are worthless outside
  # a local run; production sets JWT_SECRET.
  secret: ${JWT_SECRET:local-dev-secret-not-for-production-0123456789abcdef}
