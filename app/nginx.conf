# Every POST /auth/anonymous creates a user, so it is limited twice. CloudFlare puts the visitor's address in
# CF-Connecting-IP; but the origin can also be reached directly, where that header can be forged, so the per-address
# limit is best effort and the global one (no header involved) is what bounds the growth of the users table.
map $http_cf_connecting_ip $client_ip {
    default $remote_addr;
    "~."    $http_cf_connecting_ip;
}
limit_req_zone $client_ip   zone=anon_per_ip:10m rate=2r/m;
limit_req_zone "all"        zone=anon_total:1m   rate=6r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    limit_req_status 429;

    # Prometheus scrapes the gateway directly inside the docker network; nobody outside needs its actuator.
    location /api/actuator/ {
        return 404;
    }

    location = /api/auth/anonymous {
        limit_req zone=anon_per_ip burst=3 nodelay;
        limit_req zone=anon_total burst=10 nodelay;
        set $upstream http://gateway:8080;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        set $upstream http://gateway:8080;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2048m;
        proxy_read_timeout 14400s;
    }

    location /metrics {
        default_type "text/plain; version=0.0.4; charset=utf-8";
        alias /usr/share/nginx/html/metrics.txt;
    }

    location = /transcript {
        set $upstream http://gateway:8080;
        proxy_pass $upstream;
    }

    location = /export {
        set $upstream http://gateway:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
